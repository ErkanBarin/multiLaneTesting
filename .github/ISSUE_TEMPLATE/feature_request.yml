name: Feature Request
description: Suggest a new feature or improvement
labels: ["enhancement"]
body:
  - type: markdown
    attributes:
      value: |
        Please search existing issues before submitting to avoid duplicates.
        This project is experimental and pre-1.0; not all requests can be
        prioritized.

  - type: textarea
    id: problem
    attributes:
      label: Problem or motivation
      description: What problem does this feature solve? What is the current limitation?
    validations:
      required: true

  - type: textarea
    id: solution
    attributes:
      label: Proposed solution
      description: Describe the change or addition you have in mind.
    validations:
      required: true

  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
      description: Any other approaches you evaluated, and why you prefer the proposed one.

  - type: textarea
    id: context
    attributes:
      label: Additional context
      description: Anything else relevant — links, examples, prior art.
