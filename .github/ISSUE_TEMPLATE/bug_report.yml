name: Bug Report
description: Report a defect or unexpected behavior
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Before submitting, please search existing issues to avoid duplicates.
        **Do not paste internal hostnames, credentials, tokens, or secrets into this form.**

  - type: dropdown
    id: package
    attributes:
      label: Package(s) affected
      description: Select all packages that are involved in the bug.
      multiple: true
      options:
        - "@erkanbarin/core"
        - "@erkanbarin/cli"
        - "@erkanbarin/http"
        - "@erkanbarin/stomp"
        - "@erkanbarin/web"
        - "@erkanbarin/screen"
        - "@erkanbarin/authoring-http"
        - "@erkanbarin/authoring-stomp"
        - "@erkanbarin/authoring-web"
        - "@erkanbarin/playwright-config"
        - "python screen driver"
        - "docs / examples"
        - "other / unsure"
    validations:
      required: true

  - type: input
    id: node-version
    attributes:
      label: Node version
      description: Output of `node --version`
      placeholder: "v20.x.x"
    validations:
      required: true

  - type: input
    id: os
    attributes:
      label: Operating system
      placeholder: "e.g. Ubuntu 22.04, macOS 14, Windows 11"
    validations:
      required: true

  - type: textarea
    id: reproduction
    attributes:
      label: Steps to reproduce
      description: Minimal steps that reliably trigger the bug.
      placeholder: |
        1. Run `npm run ...`
        2. Observe ...
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
      description: What should have happened?
    validations:
      required: true

  - type: textarea
    id: actual
    attributes:
      label: Actual behavior
      description: What happened instead?
    validations:
      required: true

  - type: textarea
    id: logs
    attributes:
      label: Relevant logs or output
      description: |
        Paste relevant log output here.
        **Remove any internal hostnames, credentials, tokens, or secrets before pasting.**
      render: shell
